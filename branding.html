<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branding | C2 Design Group</title><meta name="description" content="Distinctive identities, visual systems, and purposeful creative direction that give brands momentum."><style>
:root{--plum:#1E1545;--pink:#EE2652;--teal:#00BAB4;--max:1280px;--gutter:clamp(20px,5vw,72px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080a0f;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.experience{position:relative;height:185vh}.stage{height:100vh;height:100dvh;position:sticky;top:0;overflow:hidden;isolation:isolate;background:#080a0f}.backdrop{position:absolute;inset:-10%;background-image:linear-gradient(115deg,rgba(30,21,69,.90),rgba(30,21,69,.30)),url(https://static.wixstatic.com/media/beab6e_ebe8695f9898450db1bb12536b3788e4f000.jpg);background-size:cover;background-position:center;transform:scale(1.15);will-change:transform;filter:saturate(.9)}.glow{position:absolute;width:65vmax;height:65vmax;right:-25vmax;top:-25vmax;border-radius:50%;background:radial-gradient(circle,rgba(0,186,180,.24),rgba(238,38,82,.12) 30%,transparent 65%);filter:blur(25px);mix-blend-mode:screen;pointer-events:none}.inner{position:relative;z-index:3;max-width:var(--max);height:100%;margin:auto;padding:0 var(--gutter);display:flex;align-items:center}.copy{max-width:750px;transform:translateY(30px);opacity:0;animation:intro 1.2s .15s ease forwards}.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.72;margin:0 0 22px}h1{font-size:clamp(54px,8vw,124px);line-height:.87;letter-spacing:-.068em;margin:0;max-width:850px}.desc{font-size:clamp(16px,1.6vw,20px);line-height:1.6;max-width:580px;opacity:.76;margin:28px 0 0}.motif{position:absolute;z-index:2;right:clamp(-80px,5vw,90px);top:50%;width:clamp(240px,32vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:grid;place-items:center;font-size:clamp(100px,20vw,290px);font-weight:800;letter-spacing:-.13em;color:rgba(255,255,255,.12);pointer-events:none;will-change:transform,opacity}.motif:before,.motif:after{content:'';position:absolute;inset:13%;border:1px solid rgba(255,255,255,.13);border-radius:50%}.motif:after{inset:28%}.progress{position:absolute;bottom:0;left:0;width:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--teal));z-index:5}.hint{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.17em;text-transform:uppercase;opacity:.55;z-index:5}@keyframes intro{to{transform:none;opacity:1}}@media(max-width:700px){.motif{right:-100px;opacity:.4!important}.inner{align-items:center}h1{font-size:clamp(50px,13vw,84px)}.desc{max-width:85%}}@media(prefers-reduced-motion:reduce){.copy{animation:none;opacity:1;transform:none}}
</style></head><body><main class="experience" id="experience"><section class="stage" aria-label="Branding animated introduction"><div class="backdrop" id="backdrop"></div><div class="glow" id="glow"></div><div class="motif" id="motif" aria-hidden="true">C2</div><div class="inner"><div class="copy" id="copy"><p class="kicker">02 / Branding</p><h1>Make an impression.</h1><p class="desc">Distinctive identities, visual systems, and purposeful creative direction that give brands momentum.</p></div></div><div class="hint">Scroll to explore ↓</div><div class="progress" id="progress"></div></section></main><script>
const el=document.getElementById('experience'),bg=document.getElementById('backdrop'),motif=document.getElementById('motif'),glow=document.getElementById('glow'),copy=document.getElementById('copy'),bar=document.getElementById('progress');let frame=0;function draw(){frame=0;const r=el.getBoundingClientRect();const travel=Math.max(1,el.offsetHeight-innerHeight);const p=Math.max(0,Math.min(1,-r.top/travel));bg.style.transform=`scale(${1.15+p*.17}) translate3d(${-p*3}%,${p*4}%,0)`;motif.style.transform=`translate3d(${-p*13}vw,${-p*8}vh,0) rotate(${p*140}deg)`;motif.style.opacity=String(Math.max(.06,.7-p*.45));glow.style.transform=`translate3d(${-p*18}vw,${p*18}vh,0)`;copy.style.opacity=String(Math.max(.18,1-p*.7));bar.style.width=(p*100)+'%'}function update(){if(!frame)frame=requestAnimationFrame(draw)}addEventListener('scroll',update,{passive:true});addEventListener('resize',update);draw();
</script></body></html>
