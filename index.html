<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C2DG | Lightweight Iframe Performance Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #1E1545; color: #fff; font: 18px/1.5 Arial, sans-serif; }
    main { min-height: 100vh; display: flex; align-items: center; padding: 32px max(24px, calc((100vw - 1222px)/2)); }
    h1 { font-size: clamp(32px, 6vw, 72px); line-height: 1.1; margin: 0 0 18px; }
    p { max-width: 560px; margin: 0; }
    .accent { color: #00BAB4; font-weight: bold; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="accent">C2 Design Group / Diagnostic</p>
      <h1>Iframe test page.</h1>
      <p>Static HTML only. No JavaScript, animations, external fonts, images, videos, or 3D models.</p>
    </div>
  </main>
</body>
</html>
