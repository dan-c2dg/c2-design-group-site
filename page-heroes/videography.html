<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videography | C2 Design Group</title><meta name="description" content="Cinematic video production and motion by C2 Design Group"><style>
:root{--plum:#1E1545;--pink:#EE2652;--teal:#00BAB4;--max:1280px}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{background:#080a0f;color:#fff;font-family:Arial,Helvetica,sans-serif}
.hero{position:relative;height:100svh;min-height:0;overflow:hidden;isolation:isolate;background:#101322;--p:0}
.media,.tint,.lights,.foreground,.hero-title,.sky-title{position:absolute;inset:0}
.media{z-index:0;background-position:center;background-size:cover;will-change:transform,opacity}
.tint{z-index:2;background:linear-gradient(90deg,rgba(8,10,15,.76) 0%,rgba(8,10,15,.35) 50%,rgba(8,10,15,.12) 100%);pointer-events:none}
.content{position:relative;z-index:8;width:calc(100% - 96px);max-width:1280px;height:100%;margin:auto;display:flex;align-items:center;pointer-events:none}
.copy{max-width:660px;transform:translate3d(0,calc((.5 - var(--p))*20px),0)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#85f2e8;margin:0 0 20px}

.lede{font-size:clamp(16px,1.6vw,20px);line-height:1.5;max-width:520px;color:rgba(255,255,255,.86);margin:0}
.rule{display:block;margin-top:28px;width:80px;height:3px;background:linear-gradient(90deg,var(--pink),var(--teal))}
.tag{position:absolute;z-index:9;bottom:24px;left:max(48px,calc((100% - 1280px)/2));font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#d7e8e8}
@media(max-width:1280px){.content{width:calc(100% - 80px)}.tag{left:40px}}
@media(max-width:768px){.content{width:calc(100% - 48px)}.copy{max-width:85%}h1{font-size:clamp(48px,9vw,76px)}.tag{left:24px}.tint{background:linear-gradient(90deg,rgba(8,10,15,.72),rgba(8,10,15,.24))}}
@media(max-width:390px){.content{width:calc(100% - 36px)}.copy{max-width:100%}h1{font-size:clamp(43px,12vw,54px)}.lede{font-size:15px;line-height:1.45}.kicker{font-size:9px}.tag{left:18px;font-size:8px}}
@media(max-height:580px){h1{font-size:clamp(35px,5vw,68px);margin:12px 0}.lede{font-size:14px}.rule{margin-top:12px}.tag{bottom:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.video{position:absolute;z-index:0;width:100%;height:100%;inset:0;object-fit:cover;object-position:center;filter:saturate(.86) contrast(1.12);transform:scale(1.035)}.lights{z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.65}.beam{position:absolute;width:75vw;height:35vw;filter:blur(44px);border-radius:50%;transform-origin:center;animation:floatLight 12s ease-in-out infinite alternate}.beam-one{left:-28%;top:-25%;background:radial-gradient(ellipse,rgba(0,186,180,.52),transparent 67%)}.beam-two{right:-25%;bottom:-30%;background:radial-gradient(ellipse,rgba(238,38,82,.42),transparent 67%);animation-delay:-6s}.orb{position:absolute;width:30vw;height:30vw;right:15%;top:5%;border-radius:50%;background:radial-gradient(circle,rgba(96,59,166,.34),transparent 70%);filter:blur(35px);animation:floatLight 15s ease-in-out infinite alternate-reverse}@keyframes floatLight{0%{transform:translate(-8%,4%) rotate(-15deg)}100%{transform:translate(12%,-9%) rotate(17deg)}}@media(max-width:390px){.video{object-position:55% center}.lights{opacity:.5}}</style></head><body data-page="videography"><main class="hero" style="--p:0"><video class="video" autoplay muted loop playsinline preload="metadata" poster="assets/lug-pool-night.webp"><source src="assets/trim1.mp4" type="video/mp4"></video><div class="lights"><i class="beam beam-one"></i><i class="beam beam-two"></i><i class="orb"></i></div><div class="tint"></div><div class="content"><div class="copy"><p class="kicker">C2 Design Group / Videography</p><h1>Give the story<br>a pulse.</h1><p class="lede">Motion that makes an impression. Cinematic content that connects the story to the audience.</p><span class="rule"></span></div></div><div class="tag">Motion / Film / Storytelling</div></main><script>
(()=>{const root=document.querySelector('.hero');let external=false,start=performance.now();const clamp=v=>Math.max(0,Math.min(1,v));function setProgress(v){root.style.setProperty('--p',clamp(v).toFixed(4));root.dispatchEvent(new CustomEvent('c2progress',{detail:clamp(v)}));}
const params=new URLSearchParams(location.search);const auto=params.get('mode')!=='scroll';
if(!auto){document.body.style.minHeight='260vh';root.style.position='sticky';root.style.top='0';addEventListener('scroll',()=>{if(!external){let max=Math.max(1,document.documentElement.scrollHeight-innerHeight);setProgress(scrollY/max)}},{passive:true});}
addEventListener('message',e=>{if(!['https://creative-c2dg.wixstudio.com'].includes(e.origin))return;const d=e.data||{};if(d.channel==='c2dg-page-hero-v1'&&d.type==='SCROLL_PROGRESS'&&Number.isFinite(Number(d.progress))){external=true;setProgress(Number(d.progress));}});
function tick(t){if(!external&&auto){let p=(t-start)/7000;setProgress(Math.min(1,p));}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function ready(){parent.postMessage({channel:'c2dg-page-hero-v1',type:'READY',page:document.body.dataset.page},'*')}ready();addEventListener('load',ready);
})();
</script><script></script></body></html>
